spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  refresh-token:
    expiration-ms: 1209600000
    max-sessions-per-user: 10
    cookie-name: refreshToken