spring:
  application:
    name: shop-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  config:
    import: optional:file:.env[.properties], classpath:bucket4j.yml

jwt:
  secret-key: ${JWT_SECRET}
  expiration-time: ${JWT_EXPIRATION_TIME}

app:
  refresh-token:
    expiration-ms: 1209600000
    max-sessions-per-user: 10
    cookie-name: refreshToken

  cart-token:
    expiration-ms: 604800000
    cookie-name: cart_token
    secure: true

api:
  title: ShopAPI
  description: Backend service for shop management
  contact:
    name: Filip Chyła
    email: f.chyla12@gmail.com