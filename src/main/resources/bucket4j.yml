bucket4j:
  enabled: true
  filters:
    - id: auth-strict
      cache-name: rate-limit-auth-strict
      url: /api/v1/auth/(register|authenticate)
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 5
              time: 15
              unit: minutes

    - id: auth-tokens
      cache-name: rate-limit-auth-tokens
      url: /api/v1/auth/(refresh|logout|logout-all)
      rate-limits:
        - cache-key: "@securityUtils.currentUserId()"
          bandwidths:
            - capacity: 10
              time: 1
              unit: hours

    - id: user-writes
      cache-name: rate-limit-user-writes
      url: /api/v1/user/me
      rate-limits:
        - execute-condition: "getMethod() == 'PATCH' or getMethod() == 'DELETE'"
          cache-key: "@securityUtils.currentUserId()"
          bandwidths:
            - capacity: 20
              time: 1
              unit: hours

    - id: user-reads
      cache-name: rate-limit-user-reads
      url: /api/v1/user/me
      rate-limits:
        - execute-condition: "getMethod() == 'GET'"
          cache-key: "@securityUtils.currentUserId()"
          bandwidths:
            - capacity: 100
              time: 1
              unit: minutes